<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Surge</title>
    <style>
      body{
        font-family:sans-serif;
        max-width:420px;
        margin:16px auto;
        padding:0 12px;
        color:#222
      }
      canvas{
        width:100%;
        display:block;
        touch-action:none;
        border:1px solid #ddd;
        border-radius:8px;
        background:#fff
      }
      .row{
        display:flex;
        align-items:center;
        gap:10px;
        margin-top:12px
      }
      #s{
        flex:1
      }
      #l{
        font-size:14px;
        font-weight:500;
        margin:6px 0 10px
      }
      button{
        width:100%;
        padding:10px;
        font-size:14px
      }
      p{
        font-size:12px;
        color:#666
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="row"><span>Rays</span><input id="s" type="range" min="0" max="2" step="1" value="0"></div>
    <div id="l"></div>
    <button id="b"></button>
    <p>Move over the rays to pull them toward you. Tap a ray to recolor it.</p>
    <script>
      const cv=document.getElementById('c'), ctx=cv.getContext('2d');
      const W=cv.width=760, H=cv.height=560, U=90;
      const RES=[
        {n:'Charonite', c:['#7E7E82', '#515B65', '#70707A']},
        {n:'Elmerine', c:['#FFC759', '#FFE86F', '#FF8F60']},
        {n:'Qanetite', c:['#863DFF', '#5E3EDC', '#4925D6']},
        {n:'Beta-Pylene', c:['#F26F67', '#FFB68C', '#C02E63']},
        {n:'Hell Gem', c:['#A6F246', '#E3FD43', '#4CB96B']},
        {n:'Chromalit', c:['#B5FFD2', '#FFFDD0', '#AFC5FC']},
        {n:'Celestial foam', c:['#CED8D2', '#F8EFDA', '#9F9FAD']},
        {n:'Hollow Stone', c:['#D5B57D', '#FBF0D9', '#843317']},
        {n:'Void', c:['#000', '#000', '#000']},
        {n:'Reality', c:['#F8F8EF', '#FFE1F0', '#E6E4FF']}
      ];
      const COUNTS=[3, 8, 13];
      let pal=0, rays=[], mouse=null;
      const R=Math.random;
      const uvToXY=(u, v)=>[W/2+(u-v)*.866*U, H*.62+(u+v)*.5*U];
      const xyToUV=(x, y)=>{
        const d=(x-W/2)/(.866*U), s=(y-H*.62)/(.5*U);
        return[(s+d)/2, (s-d)/2]
      };
      function bez(p, t){
        const m=1-t;
        return[0, 1].map(i=>m*m*m*p[0][i]+3*m*m*t*p[1][i]+3*m*t*t*p[2][i]+t*t*t*p[3][i])
      }
      function make(n){
        rays=[];
        for(let i=0;i<n;i++){
          rays.push({o:[R()*.4-.2, R()*.4-.2], a:R()*6.28, ar:R()*3, h:R()*2, s:R()*2-1, r:R()*2-1, dr:R(), rs:R(), reach:.5+R(), c:Math.floor(R()*3), line:[]})
        }
      }
      function pts(r, t){
        const rr=r.r+Math.cos(t*r.rs)*r.dr, A=[Math.cos(t*r.s)*rr,  Math.sin(t*r.s)*rr];
        const B=mouse||A, d=Math.hypot(B[0], B[1]);
        const f=mouse?Math.min(Math.max(0, (d*r.reach-1)/2), 1):1;
        const E=[A[0]*f+B[0]*(1-f), A[1]*f+B[1]*(1-f)];
        const sh=[-r.h*f+Math.cos(r.a)*r.ar*(1-f), -r.h*f+Math.sin(r.a)*r.ar*(1-f)];
        return{p:[[r.o[0], r.o[1]], [r.o[0]-r.h, r.o[1]-r.h], [E[0]+sh[0], E[1]+sh[1]], E], f}
      }
      function draw(ms){
        const t=ms/600;ctx.clearRect(0, 0, W, H);ctx.lineWidth=U*.02;
        rays.forEach(r=>{
          const o=pts(r, t);ctx.strokeStyle=RES[pal].c[r.c];
          ctx.beginPath();
          for(let j=0;j<=1.001;j+=.1){
            const q=bez(o.p, Math.min(j, 1)), xy=uvToXY(q[0], q[1]);
            if(j>0&&j<.99){
              xy[0]+=(R()*2-1)*U*(.02+o.f*.04);xy[1]+=(R()*2-1)*U*(.02+o.f*.04)
            }
            ctx.lineTo(xy[0], xy[1])}
            ctx.stroke();
            r.line=[];
            for(let j=0;j<=1.001;j+=.05){
              const q=bez(o.p, Math.min(j, 1));r.line.push(uvToXY(q[0], q[1]))
            }
        });
        requestAnimationFrame(draw)
      }
      function local(e){
        const b=cv.getBoundingClientRect();
        return[(e.clientX-b.left)*W/b.width, (e.clientY-b.top)*H/b.height]
      }
      function segDist(p, a, b){
        const dx=b[0]-a[0], dy=b[1]-a[1], l=dx*dx+dy*dy;
        let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0, Math.min(1, t));
        return Math.hypot(p[0]-(a[0]+t*dx), p[1]-(a[1]+t*dy))
      }
      function pick(p){
        let best=null, bd=56;
        rays.forEach(r=>{
          for(let i=1;i<r.line.length;i++){
            const d=segDist(p, r.line[i-1], r.line[i]);
            if(d<bd){
              bd=d;best=r
            }
          }
        });
        return best
      }
      cv.onpointermove=e=>{
        if(e.pointerType==='mouse'){
          mouse=xyToUV(...local(e))
        }
      };
      cv.onpointerleave=()=>{
        mouse=null
      };
      cv.onpointerdown=e=>{
        const p=local(e);
        const hit=pick(p);
        if(hit){
          hit.c=(hit.c+1)%3;
        }
        if(e.pointerType!=='mouse'){
          mouse=null;
        }
        else
          mouse=xyToUV(...p)
      };
      const S=document.getElementById('s'), L=document.getElementById('l'), B=document.getElementById('b');
      function setN(){
        const g=+S.value;L.textContent=COUNTS[g]+' rays, grade '+g+' ('+'★'.repeat(g+1)+')';make(COUNTS[g])
      }
      function setRes(){
        B.textContent='Resource: '+RES[pal].n+' (tap to change)'
      }
      S.oninput=setN;
      B.onclick=()=>{
        pal=(pal+1)%RES.length;
        setRes()
      };
      setN();
      setRes();
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
